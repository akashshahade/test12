document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

l)\" style=\"border:1px solid rgba(35,28,23,.12);border-radius:10px;padding:10px;font-size:13.5px;min-height:56px;resize:vertical;background:#fff\"><\u002Ftextarea>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ d.fbThanks }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"margin-top:14px;font-size:13.5px;color:rgba(35,28,23,.6)\">Thanks for the feedback.<\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n<\u002Fdiv>\n\n<sc-if value=\"{{ hasToast }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#231c17;color:#fdf8f1;padding:12px 18px;border-radius:12px;font-size:13.5px;box-shadow:0 16px 40px -16px rgba(0,0,0,.5);z-index:50;max-width:90vw\">{{ toast }}<\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;startView&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;stage&quot;,&quot;board&quot;],&quot;default&quot;:&quot;stage&quot;,&quot;tsType&quot;:&quot;'stage'|'board'&quot;}}\">\nclass Component extends DCLogic {\n  STAGES = [\n    { n: \"Get Started\", c: \"Graduate Admissions Office\" },\n    { n: \"Finance\", c: \"Student Financial Services\" },\n    { n: \"Visa\", c: \"Dashew Center for International Students\" },\n    { n: \"Healthcare\", c: \"Student Health Services\" },\n    { n: \"Housing\", c: \"Housing & Residence Life\" },\n    { n: \"Essentials\", c: \"Dashew Center for International Students\" },\n    { n: \"Travel\", c: \"Dashew Center for International Students\" },\n    { n: \"Arrival\", c: \"Dashew Center for International Students\" }\n  ];\n  P = {\n    loan: [{ n: \"Northbridge Student Loans\", d: \"No co-signer · support letter available\" }, { n: \"Meridian Edu Finance\", d: \"Sanction letter in 48 hours\" }, { n: \"Atlas Lending\", d: \"Fixed rate · grace period to graduation\" }],\n    ins: [{ n: \"Campus Shield\", d: \"Meets UCLA waiver · no annual cap\" }, { n: \"Harbor Student Health\", d: \"Dental and vision included\" }, { n: \"GlobeCare Basic\", d: \"Waiver-ready · telehealth\" }],\n    house: [{ n: \"Commonwealth Rentals\", d: \"Verified listings near campus\" }, { n: \"Nest Student Living\", d: \"Furnished rooms · no US guarantor\" }, { n: \"Leaseguard\", d: \"Guarantor service for students\" }],\n    bank: [{ n: \"Beacon Bank\", d: \"Open your account before you land\" }, { n: \"Liberty Student Checking\", d: \"No monthly fees\" }],\n    card: [{ n: \"Wayfare Card\", d: \"Load at home, spend in USD\" }],\n    fly: [{ n: \"SkyStudent\", d: \"Student fares · code ANDERSON26 for extra bag\" }, { n: \"FlyCampus\", d: \"Flexible dates · code AFTERADMIT\" }],\n    phone: [{ n: \"Roam eSIM\", d: \"Activate before you fly\" }, { n: \"Campus Mobile\", d: \"Student plan · unlimited data\" }]\n  };\n  MS = [\n    { id: 1, s: 0, t: \"Offer accepted\", desc: \"Accept your admission in the Anderson applicant portal and pay the enrollment deposit to hold your place.\", why: \"Your seat, school accounts and every later step depend on this.\", tasks: [\"Accept in the applicant portal\", \"Pay the enrollment deposit\", \"Save the payment receipt\"] },\n    { id: 3, s: 0, t: \"School accounts active\", req: 1, desc: \"Activate your UCLA logon, school email and student portal.\", why: \"Most forms in later stages are submitted through the student portal.\", tasks: [\"Activate your UCLA logon\", \"Set up your school email\", \"Upload a photo for your student ID\"] },\n    { id: 4, s: 0, t: \"Joined community groups\", desc: \"Join your program's Slack or WhatsApp group and the Anderson groups on AfterAdmit.\", why: \"Classmates share roommate, housing and travel plans here first.\", tasks: [\"Join your program's Slack or WhatsApp group\", \"Join Anderson Fall '28 groups on AfterAdmit\"] },\n    { id: 5, s: 0, t: \"Transcripts and degree submitted\", desc: \"Send final transcripts and your degree certificate to admissions.\", why: \"Enrollment stays provisional until final documents arrive.\", tasks: [\"Request final transcripts from your college\", \"Submit your degree certificate\", \"Get a credential evaluation if required\"] },\n    { id: 6, s: 1, t: \"Cost of attendance checked\", desc: \"Review UCLA Anderson's full cost of attendance for your program.\", why: \"This number sets your funding target and the proof of funds for your I-20.\", tasks: [\"Review tuition, fees and living costs\", \"Note the proof-of-funds amount\"] },\n    { id: 7, s: 1, t: \"Funding sources confirmed\", req: 6, desc: \"Confirm how you will cover the full cost.\", why: \"Gaps found late can delay your I-20 and visa.\", tasks: [\"List savings, sponsor, scholarship and loan amounts\", \"Check the total covers the cost of attendance\"] },\n    { id: 8, s: 1, t: \"Loan secured\", rule: \"loan\", req: 7, desc: \"Get rate quotes from lenders, compare them, and receive your sanction letter.\", why: \"The sanction letter is accepted as proof of funds.\", tasks: [\"Submit applications and get rate quotes\", \"Compare lenders on interest rate and terms\", { t: \"Request a support letter\", intl: true }, \"Apply and receive the sanction letter\"], prov: \"loan\" },\n    { id: 9, s: 1, t: \"Financial documents submitted for the I-20\", intl: true, req: 7, desc: \"Upload bank statements, sponsor letters and loan letters to the Dashew Center portal.\", why: \"UCLA issues your I-20 only after approving these documents.\", tasks: [\"Gather bank statements and sponsor letters\", \"Upload in the format the Dashew Center requires\"] },\n    { id: 10, s: 2, t: \"I-20 received\", intl: true, req: 9, desc: \"Download your I-20 and check every detail.\", why: \"Errors on the I-20 can lead to a visa refusal.\", tasks: [\"Check your name, program and dates\", \"Sign page 1\"] },\n    { id: 11, s: 2, t: \"DS-160 submitted and interview booked\", intl: true, req: 10, desc: \"Complete the visa application form and book your consulate interview.\", why: \"Interview slots fill quickly in summer.\", tasks: [\"Fill in the DS-160\", \"Pay the visa application fee\", \"Book the interview\"] },\n    { id: 12, s: 2, t: \"SEVIS fee paid\", intl: true, req: 10, desc: \"Pay the I-901 SEVIS fee using the number on your I-20.\", why: \"You need the receipt at your visa interview.\", tasks: [\"Pay the I-901 SEVIS fee\", \"Save the receipt\"] },\n    { id: 13, s: 2, t: \"Visa document checklist ready\", intl: true, desc: \"Assemble everything the consulate may ask for.\", why: \"Missing documents are the most common reason for a 221(g) delay.\", tasks: [\"Passport, I-20 and DS-160 confirmation\", \"Financial documents and SEVIS receipt\", \"Admission letter and transcripts\"] },\n    { id: 15, s: 3, t: \"School insurance plan or waiver approved\", desc: \"Enroll in UCLA Anderson's plan, or file a waiver with a plan that meets UCLA Anderson's requirements.\", why: \"UCLA adds its plan to your bill automatically if no waiver is approved.\", tasks: [\"Compare the school plan with waiver-ready plans\", \"Enroll or file the waiver\"], prov: \"ins\" },\n    { id: 16, s: 3, t: \"Immunization records uploaded\", desc: \"Upload vaccination records to the student health portal.\", why: \"Registration holds are placed on students without approved records.\", tasks: [\"Get records from your doctor\", \"Upload to the health portal\"] },\n    { id: 17, s: 3, t: \"Checkups done at home\", desc: \"See your doctor, dentist and optometrist before you leave.\", why: \"These visits usually cost much more in the US.\", tasks: [\"Medical checkup\", \"Dental checkup\", \"Eye checkup\"] },\n    { id: 18, s: 3, t: \"Prescriptions stocked\", desc: \"Bring a supply of regular medication with a doctor's letter.\", why: \"Some medicines need a new US prescription, which takes time.\", tasks: [\"Stock regular medication\", \"Get a doctor's letter for customs\"] },\n    { id: 19, s: 4, t: \"Housing type decided\", desc: \"Choose on- or off-campus housing and shortlist neighborhoods.\", why: \"On-campus spots and good leases go early.\", tasks: [\"Choose on- or off-campus\", \"Shortlist neighborhoods\"] },\n    { id: 20, s: 4, t: \"Roommates confirmed\", req: 19, desc: \"Find roommates in the community hub and agree on a budget.\", why: \"Most leases near campus are for shared apartments.\", tasks: [\"Find roommates in the community hub\", \"Agree on budget and move-in date\"] },\n    { id: 21, s: 4, t: \"Lease signed\", rule: \"off\", req: 19, desc: \"Verify the listing, sign the lease and arrange a guarantor or deposit.\", why: \"Rental scams targeting new students are common. Verify before you pay.\", tasks: [\"Verify the listing\", \"Sign the lease\", \"Arrange a guarantor or deposit\"], prov: \"house\" },\n    { id: 22, s: 5, t: \"US bank account planned or opened\", desc: \"Pick a bank, and open the account now if it allows.\", why: \"You'll need a US account for rent, a phone plan and campus jobs.\", tasks: [\"Compare student accounts\", \"Open the account or book an appointment\"], prov: \"bank\" },\n    { id: 23, s: 5, t: \"International debit card ready\", intl: true, desc: \"Get a card you can use in the US for your first weeks.\", why: \"It covers costs until your US account is active.\", tasks: [\"Get a forex or international debit card\", \"Load money for your first weeks\"], prov: \"card\" },\n    { id: 24, s: 5, t: \"Home bank access set up\", intl: true, desc: \"Make sure your home bank works from abroad.\", why: \"One-time codes sent to a home number often stop working after you leave.\", tasks: [\"Enable international transactions\", \"Set up two-factor authentication that works abroad\"] },\n    { id: 25, s: 5, t: \"Packing list\", desc: \"Start the packing list for your program and climate.\", why: \"Starting early avoids overweight bags and last-minute buys.\", tasks: [\"Download the AfterAdmit packing list\", \"Check your airline's baggage limits\"] },\n    { id: 26, s: 6, t: \"Flight ticket booked\", req: 11, desc: \"Book your flight through a marketplace partner with a student discount code.\", why: \"International students can enter no earlier than 30 days before the I-20 start date.\", tasks: [\"Pick a date within your entry window\", \"Apply your student discount code\"], prov: \"fly\" },\n    { id: 27, s: 6, t: \"Packing done\", req: 25, desc: \"Finish packing using your packing list.\", why: \"Customs rules limit some foods and medicines.\", tasks: [\"Pack using your list\", \"Weigh your bags\"] },\n    { id: 28, s: 6, t: \"Document kit assembled\", desc: \"Keep important documents in your carry-on.\", why: \"You'll show these at the border and at check-in.\", tasks: [\"Passport, visa and I-20\", \"Admission letter and insurance card\", \"Lease agreement\"] },\n    { id: 29, s: 6, t: \"Arrival plan made\", desc: \"Plan your airport pickup and first 48 hours.\", why: \"The first two days set up everything else after you land.\", tasks: [\"Arrange airport pickup\", \"Plan your first 48 hours\"] },\n    { id: 30, s: 7, t: \"I-94 downloaded and international office check-in done\", intl: true, desc: \"Download your I-94 and check in with the Dashew Center.\", why: \"Your SEVIS record must be activated to keep your status.\", tasks: [\"Download and check your I-94\", \"Check in with the Dashew Center\"] },\n    { id: 31, s: 7, t: \"Orientation done\", desc: \"Attend orientation and collect your student ID.\", why: \"Orientation covers registration and campus services.\", tasks: [\"Attend orientation\", \"Collect your student ID\"] },\n    { id: 32, s: 7, t: \"Bank, SSN and essentials set up\", desc: \"Activate your bank account and apply for an SSN if eligible.\", why: \"An SSN is needed for on-campus jobs.\", tasks: [\"Activate your bank account\", \"Apply for an SSN if eligible\"] },\n    { id: 33, s: 7, t: \"Moved in\", desc: \"Move into permanent housing.\", why: \"\", tasks: [\"Collect keys\", \"Do a move-in inspection\"] },\n    { id: 34, s: 7, t: \"US phone plan active\", desc: \"Activate a US number.\", why: \"Banks and the university send codes to a US number.\", tasks: [\"Activate your plan or eSIM\"], prov: \"phone\" },\n    { id: 35, s: 7, t: \"Wi-Fi set up\", desc: \"Connect to campus Wi-Fi and set up home internet.\", why: \"\", tasks: [\"Connect to campus Wi-Fi\", \"Set up home internet\"] }\n  ];\n  state = { done: { 1: 1, 3: 1, 6: 1, 7: 1 }, na: {}, td: { \"4-0\": 1, \"8-0\": 1 }, fb: {}, view: this.props.startView || \"stage\", sel: null, selM: null, prof: { type: \"intl\", loan: true, housing: \"off\" }, edit: false, toast: null };\n  tk(m) { const intl = this.state.prof.type === \"intl\"; return m.tasks.map((x, j) => typeof x === \"string\" ? { t: x, j } : { t: x.t, intl: x.intl, j }).filter(x => !x.intl || intl); }\n  visible(m) {\n    const p = this.state.prof;\n    if (m.intl && p.type !== \"intl\") return false;\n    if (m.rule === \"loan\" && !p.loan) return false;\n    if (m.rule === \"off\" && p.housing !== \"off\") return false;\n    return true;\n  }\n  renderVals() {\n    const st = this.state, p = st.prof;\n    const vis = this.MS.filter(m => this.visible(m));\n    const status = m => st.done[m.id] ? \"done\" : st.na[m.id] ? \"na\" : this.tk(m).some(x => st.td[m.id + \"-\" + x.j]) ? \"prog\" : \"todo\";\n    const stIdx = this.STAGES.map((_, i) => i).filter(i => vis.some(m => m.s === i));\n    const firstOpen = vis.find(m => [\"todo\", \"prog\"].includes(status(m)));\n    const curStage = firstOpen ? firstOpen.s : stIdx[stIdx.length - 1];\n    const sel = st.sel != null && stIdx.includes(st.sel) ? st.sel : curStage;\n    const N = stIdx.length, notch = 16;\n    const IC = { done: { bg: \"#c4593c\", bd: \"#c4593c\", mk: \"✓\", fg: \"#fff\" }, prog: { bg: \"#fbefe7\", bd: \"#c4593c\", mk: \"•\", fg: \"#c4593c\" }, na: { bg: \"#f3ece3\", bd: \"rgba(35,28,23,.15)\", mk: \"–\", fg: \"rgba(35,28,23,.45)\" }, todo: { bg: \"#fff\", bd: \"rgba(35,28,23,.22)\", mk: \"\", fg: \"#fff\" } };\n    const LBL = { done: \"Done\", prog: \"In progress\", na: \"Not applicable\", todo: \"Not started\" };\n    const msOf = i => vis.filter(m => m.s === i);\n    const look = m => { const s = status(m); return { ...IC[s], tfg: s === \"done\" || s === \"na\" ? \"rgba(35,28,23,.45)\" : \"#231c17\", strike: s === \"done\" ? \"line-through\" : \"none\" }; };\n    const stages = stIdx.map((i, k) => {\n      const ms = msOf(i), app = ms.filter(m => status(m) !== \"na\"), d = app.filter(m => status(m) === \"done\").length;\n      const complete = d === app.length, current = i === curStage && !complete, picked = i === sel;\n      return {\n        name: this.STAGES[i].n, kicker: (k + 1) + \" · \" + d + \"/\" + app.length,\n        bg: picked ? \"#c4593c\" : complete ? \"#231c17\" : \"#f3e8dc\",\n        fg: picked || complete ? \"#fdf8f1\" : \"#231c17\",\n        clip: k === 0 ? `polygon(0 0, calc(100% - ${notch}px) 0, 100% 50%, calc(100% - ${notch}px) 100%, 0 100%)` : `polygon(0 0, calc(100% - ${notch}px) 0, 100% 50%, calc(100% - ${notch}px) 100%, 0 100%, ${notch}px 50%)`,\n        padL: k === 0 ? \"14px\" : (notch + 8) + \"px\", lift: picked && st.view === \"stage\" ? \"-4px\" : \"0px\",\n        colBorder: picked ? \"#c4593c\" : \"rgba(35,28,23,.07)\",\n        pick: () => this.setState({ sel: i, selM: null }),\n        ms: ms.map(m => ({ t: m.t, ...look(m), open: () => this.setState({ view: \"stage\", sel: i, selM: m.id }) })),\n        _d: d, _n: app.length, _k: k\n      };\n    });\n    const ms = msOf(sel);\n    const selM = (ms.find(m => m.id === st.selM) || ms.find(m => [\"todo\", \"prog\"].includes(status(m))) || ms[0]);\n    const sObj = stages[stIdx.indexOf(sel)];\n    const cur = {\n      kicker: \"STAGE \" + (sObj._k + 1) + \" OF \" + N, name: this.STAGES[sel].n,\n      count: sObj._d + \" of \" + sObj._n + \" milestones done\",\n      list: ms.map(m => {\n        const s = status(m), tks = this.tk(m), td = tks.filter(x => st.td[m.id + \"-\" + x.j] || st.done[m.id]).length;\n        return { t: m.t, ...look(m), intl: !!m.intl, sub: LBL[s] + \" · \" + td + \"/\" + tks.length + \" steps\", rowBg: m.id === selM.id ? \"#fbefe7\" : \"transparent\", weight: m.id === selM.id ? 700 : 500, pick: () => this.setState({ selM: m.id }) };\n      })\n    };\n    const m = selM, s = status(m), reqM = m.req && vis.find(x => x.id === m.req);\n    const fb = st.fb[m.id];\n    const d = {\n      t: m.t, desc: m.desc, why: m.why || \"Finishing this marks the end of your journey.\", status: LBL[s],\n      pillBg: s === \"done\" ? \"#c4593c\" : s === \"prog\" ? \"#fbefe7\" : \"#f3ece3\", pillFg: s === \"done\" ? \"#fff\" : s === \"prog\" ? \"#a8462d\" : \"rgba(35,28,23,.7)\",\n      intl: !!m.intl, hasRule: !!m.rule, rule: m.rule === \"loan\" ? \"Shown because your funding includes a loan\" : \"Shown because you chose off-campus housing\",\n      hasReq: !!reqM, req: reqM ? reqM.t : \"\", reqMark: reqM && status(reqM) === \"done\" ? \"✓\" : \"\", reqFg: reqM && status(reqM) === \"done\" ? \"rgba(35,28,23,.55)\" : \"#a8462d\",\n      tasks: this.tk(m).map(({ t, j, intl }) => {\n        const key = m.id + \"-\" + j, on = !!(st.td[key] || st.done[m.id]);\n        return { t: intl ? t + \" (international students)\" : t, mk: on ? \"✓\" : \"\", bg: on ? \"#c4593c\" : \"#fff\", bd: on ? \"#c4593c\" : \"rgba(35,28,23,.22)\", fg: on ? \"rgba(35,28,23,.45)\" : \"#231c17\", strike: on ? \"line-through\" : \"none\",\n          toggle: () => this.setState(x => ({ td: { ...x.td, [key]: on ? 0 : 1 }, done: on && x.done[m.id] ? { ...x.done, [m.id]: 0 } : x.done })) };\n      }),\n      hasProv: !!m.prov, prov: (this.P[m.prov] || []).map(pv => ({ ...pv, go: () => { this.setState({ toast: \"Opening \" + pv.n + \" in a new tab. Your click is recorded as a referral.\" }); clearTimeout(this._t); this._t = setTimeout(() => this.setState({ toast: null }), 2800); } })),\n      contact: this.STAGES[m.s].c,\n      doneLabel: s === \"done\" ? \"Done ✓ · Undo\" : \"Mark milestone done\", doneBg: s === \"done\" ? \"#f3e8dc\" : \"#c4593c\", doneFg: s === \"done\" ? \"#231c17\" : \"#fff\",\n      toggleDone: () => this.setState(x => { const was = !!x.done[m.id]; return { done: { ...x.done, [m.id]: was ? 0 : 1 }, na: { ...x.na, [m.id]: 0 }, fb: was ? x.fb : { ...x.fb, [m.id]: x.fb[m.id] || \"ask\" } }; }),\n      naLabel: s === \"na\" ? \"Undo not applicable\" : \"Not applicable to me\",\n      toggleNa: () => this.setState(x => ({ na: { ...x.na, [m.id]: x.na[m.id] ? 0 : 1 }, done: { ...x.done, [m.id]: 0 } })),\n      askFb: s === \"done\" && fb === \"ask\", fbThanks: s === \"done\" && fb === \"thanks\",\n      fbSend: () => this.setState(x => ({ fb: { ...x.fb, [m.id]: \"thanks\" } }))\n    };\n    const app = vis.filter(x => status(x) !== \"na\"), dn = app.filter(x => status(x) === \"done\").length;\n    const hidden = this.MS.length - vis.length;\n    const setP = (k, v) => () => this.setState(x => ({ prof: { ...x.prof, [k]: v }, sel: null, selM: null }));\n    const grp = (label, k, opts) => ({ label, opts: opts.map(([v, l]) => ({ l, bg: p[k] === v ? \"#fff\" : \"transparent\", pick: setP(k, v) })) });\n    const si = stIdx.indexOf(sel);\n    return {\n      stages, cur, d, isStage: st.view === \"stage\", isBoard: st.view === \"board\",\n      cols: `repeat(${N}, minmax(0, 1fr))`,\n      minW: \"0px\",\n      vStageBg: st.view === \"stage\" ? \"#fff\" : \"transparent\", vBoardBg: st.view === \"board\" ? \"#fff\" : \"transparent\",\n      setStage: () => this.setState({ view: \"stage\" }), setBoard: () => this.setState({ view: \"board\" }),\n      doneLabel: dn + \" of \" + app.length + \" milestones done\", pct: Math.round(dn / app.length * 100) + \"%\",\n      prev: () => si > 0 && this.setState({ sel: stIdx[si - 1], selM: null }), next: () => si < N - 1 && this.setState({ sel: stIdx[si + 1], selM: null }),\n      prevOp: si === 0 ? 0.35 : 1, nextOp: si === N - 1 ? 0.35 : 1,\n      profileChips: [p.type === \"intl\" ? \"International (F-1)\" : \"Domestic\", p.loan ? \"Funding includes a loan\" : \"No loan\", p.housing === \"off\" ? \"Off-campus housing\" : \"On-campus housing\"],\n      hiddenNote: hidden ? hidden + \" milestones hidden\" : \"\",\n      editOpen: st.edit, editLabel: st.edit ? \"Done\" : \"Edit answers\", toggleEdit: () => this.setState(x => ({ edit: !x.edit })),\n      editGroups: [grp(\"Student type\", \"type\", [[\"intl\", \"International\"], [\"dom\", \"Domestic\"]]), grp(\"Loan\", \"loan\", [[true, \"Yes\"], [false, \"No\"]]), grp(\"Housing\", \"housing\", [[\"on\", \"On-campus\"], [\"off\", \"Off-campus\"]])],\n      hasToast: !!st.toast, toast: st.toast || \"\"\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
